name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: server/package-lock.json }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: Validate release version
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') { throw 'Tag must be semantic versioned.' }
          $version = "${{ github.ref_name }}".Substring(1); "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - working-directory: server
        run: npm ci; npm run build; npm test; npm run validate:schema
      - run: dotnet test tests/MairsTrivia.QuestionSets.Tests/MairsTrivia.QuestionSets.Tests.csproj --configuration Release
      - run: dotnet publish editor/MairsTrivia.Editor.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/editor /p:Version=${{ env.VERSION }}
      - run: Compress-Archive -Path artifacts/editor/* -DestinationPath artifacts/MairsTrivia-Editor-v${{ env.VERSION }}.zip
      - run: choco install innosetup --no-progress --yes
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ env.VERSION }} installer\MairsTrivia.iss'
      - run: Copy-Item artifacts/installer/MairsTrivia-Editor-Setup-v${{ env.VERSION }}.exe artifacts/MairsTrivia-Editor-Setup-v${{ env.VERSION }}.exe
      - name: Install Dalamud libraries and package plugin
        shell: pwsh
        run: |
          $env:DALAMUD_HOME = "$env:RUNNER_TEMP\dalamud"; New-Item -ItemType Directory -Force -Path $env:DALAMUD_HOME | Out-Null
          Invoke-WebRequest https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile "$env:RUNNER_TEMP\dalamud.zip"; Expand-Archive -Force "$env:RUNNER_TEMP\dalamud.zip" $env:DALAMUD_HOME
          dotnet build plugin/MairsTrivia.Plugin.csproj --configuration Release /p:Version=${{ env.VERSION }}
          Copy-Item plugin/bin/Release/MairsTrivia/latest.zip artifacts/MairsTrivia-v${{ env.VERSION }}.zip
      - run: Get-ChildItem artifacts -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash) *$($_.Path | Split-Path -Leaf)" } | Set-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: { name: release-assets, path: artifacts/* }
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: release-assets, path: artifacts }
      - name: Generate and validate custom repository manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"; NOW="$(date +%s)"; URL="https://github.com/KeiJoi/mairstrivia/releases/download/${TAG}/MairsTrivia-v${VERSION}.zip"
          jq --arg version "$VERSION" --arg url "$URL" --arg now "$NOW" '.[0].AssemblyVersion=($version + ".0") | .[0].LastUpdate=$now | .[0].DownloadLinkInstall=$url | .[0].DownloadLinkUpdate=$url' pluginmaster.json > pluginmaster.next.json
          jq -e 'type == "array" and length == 1 and .[0].InternalName == "MairsTrivia" and .[0].DalamudApiLevel == 15 and (.[0].DownloadLinkInstall | startswith("https://github.com/KeiJoi/mairstrivia/releases/download/"))' pluginmaster.next.json
          mv pluginmaster.next.json pluginmaster.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" artifacts/*.zip artifacts/*.exe artifacts/SHA256SUMS.txt --title "Mair's Trivia $TAG" --generate-notes
      - name: Publish stable manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git checkout main
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pluginmaster.json; git commit -m "chore: publish plugin manifest for $TAG"; git push origin main
