name: Verify foundation

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build MairsTrivia.sln --configuration Release
      - run: dotnet test tests/MairsTrivia.QuestionSets.Tests/MairsTrivia.QuestionSets.Tests.csproj --configuration Release
  editor-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish editor/MairsTrivia.Editor.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/editor
      - run: choco install innosetup --no-progress --yes
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\MairsTrivia.iss'
