name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run validate:schema
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: dotnet restore MairsTrivia.sln
      - run: dotnet build MairsTrivia.sln --configuration Release --no-restore
      - run: dotnet test tests/MairsTrivia.QuestionSets.Tests/MairsTrivia.QuestionSets.Tests.csproj --configuration Release --no-restore
      - run: dotnet publish editor/MairsTrivia.Editor.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/editor
      - run: choco install innosetup --no-progress --yes
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\MairsTrivia.iss'
  plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: Install current Dalamud development libraries
        shell: pwsh
        run: |
          $env:DALAMUD_HOME = "$env:RUNNER_TEMP\dalamud"
          New-Item -ItemType Directory -Force -Path $env:DALAMUD_HOME | Out-Null
          Invoke-WebRequest https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP\dalamud.zip" $env:DALAMUD_HOME
          "DALAMUD_HOME=$env:DALAMUD_HOME" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: dotnet build plugin/MairsTrivia.Plugin.csproj --configuration Release
      - shell: pwsh
        run: if (!(Test-Path plugin/bin/Release/MairsTrivia/latest.zip)) { throw 'Dalamud SDK package was not created.' }
